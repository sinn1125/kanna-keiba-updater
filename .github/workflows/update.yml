name: Official racing data update
on:
  schedule:
    # UTC 00:00–08:00 = JST 09:00–17:00, 49 reservation slots.
    # Official JRA date links decide whether there is a meeting (incl. holidays).
    - cron: '*/10 0-7 * * *'
    - cron: '0 8 * * *'
  workflow_dispatch:
    inputs:
      component:
        description: 'Run all updates or only one independent component'
        required: true
        default: all
        type: choice
        options: [all, entries, weights, histories, forecasts, results, odds]
  push:
    paths:
      - 'scripts/**'
      - 'tests/**'
      - '.github/workflows/update.yml'
permissions:
  contents: write
concurrency:
  group: official-racing-update
  cancel-in-progress: false
jobs:
  update:
    name: Update ${{ matrix.component }}
    if: github.event.repository.private == false || github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 9
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        component: ${{ fromJSON(github.event_name == 'workflow_dispatch' && inputs.component != 'all' && format('["{0}"]', inputs.component) || '["entries","weights","histories","forecasts","results","odds"]') }}
    env:
      # Four jobs with one HTTP worker each: do not multiply source connections.
      JRA_FETCH_WORKERS: '1'
      JRA_STAGE_TIMEOUT: '360'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test central update protections
        run: python -m unittest discover -s tests
      - name: Independently fetch, validate and save ${{ matrix.component }}
        run: python scripts/update-component.py '${{ matrix.component }}' --publish
      - name: Keep component diagnostics
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: update-${{ matrix.component }}-${{ github.run_id }}
          path: update-report-${{ matrix.component }}.json
          if-no-files-found: ignore
          retention-days: 7
