name: Official racing data update
on:
  schedule:
    # UTC: Sat/Sun/Mon 00:00–07:50 = JST 09:00–16:50, then 17:00.
    # 48 + 1 = 49 scheduled starts/day. Non-meeting Mondays exit after discovery.
    - cron: '*/10 0-7 * * 6,0,1'
    - cron: '0 8 * * 6,0,1'
  workflow_dispatch:
  push:
    paths:
      - 'scripts/**'
      - '.github/workflows/update.yml'
permissions:
  contents: write
concurrency:
  group: official-racing-update
  cancel-in-progress: false
jobs:
  update:
    # Public repositories have free hosted runner minutes. Keep recurring runs
    # paused while private rather than consume the owner's paid allowance.
    if: github.event.repository.private == false || github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/cache@v4
        with:
          path: |
            ../profile-cache
          key: official-cache-${{ github.run_id }}
          restore-keys: official-cache-
      - name: Test central update protections
        run: python -m unittest discover -s tests
      - name: Fetch and verify central racing data
        run: python scripts/update.py
      - name: Keep update diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: update-report-${{ github.run_id }}
          path: update-report.json
          if-no-files-found: ignore
          retention-days: 7
      - name: Commit verified data
        if: always()
        run: |
          if [ ! -d dist ]; then exit 0; fi
          git add dist/
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'kanna-keiba-updater[bot]'
          git config user.email 'kanna-keiba-updater@users.noreply.github.com'
          git commit -m 'Update verified official racing snapshots'
          git push

