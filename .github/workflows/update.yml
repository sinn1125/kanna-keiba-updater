name: Official racing data update
on:
  schedule:
    # Keep live runners warm between reservations; avoid the busy hour boundary.
    # 09:07–16:37 JST, plus a 09:00 start and 17:07 final-result catch-up.
    - cron: '7,37 0-7 * * *'
    - cron: '0 0 * * *'
    - cron: '7 8 * * *'
  workflow_dispatch:
    inputs:
      component:
        description: 'Run all updates or only one independent component'
        required: true
        default: all
        type: choice
        options: [all, entries, weights, histories, forecasts, results, odds]
  push:
    paths:
      - 'scripts/**'
      - 'tests/**'
      - '.github/workflows/update.yml'
permissions:
  contents: write
jobs:
  update:
    name: Update ${{ matrix.component }}
    if: github.ref == 'refs/heads/main' && (github.event.repository.private == false || github.event_name != 'schedule')
    concurrency:
      group: official-racing-${{ matrix.component }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        component: ${{ fromJSON(github.event_name == 'workflow_dispatch' && inputs.component != 'all' && format('["{0}"]', inputs.component) || '["results","odds","entries","weights","forecasts","histories"]') }}
    env:
      # Four jobs with one HTTP worker each: do not multiply source connections.
      JRA_FETCH_WORKERS: '1'
      JRA_STAGE_TIMEOUT: '360'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test central update protections
        run: python -m unittest discover -s tests
      - name: Keep results and odds updating on the same runner
        if: github.event_name == 'schedule' && (matrix.component == 'results' || matrix.component == 'odds')
        run: python scripts/live-session.py '${{ matrix.component }}' --minutes 30
      - name: Independently fetch, validate and save ${{ matrix.component }}
        if: github.event_name != 'schedule' || (matrix.component != 'results' && matrix.component != 'odds')
        run: python scripts/update-component.py '${{ matrix.component }}' --publish
      - name: Keep component diagnostics
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: update-${{ matrix.component }}-${{ github.run_id }}
          path: update-report-${{ matrix.component }}.json
          if-no-files-found: ignore
          retention-days: 7

